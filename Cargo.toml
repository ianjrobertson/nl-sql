[package]
name = "nl-sql"
version = "0.1.0"
edition = "2024"

[dependencies]
rusqlite = { version = "0.34", features = ["bundled"] }
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dotenvy = "0.15"
colored = "3"
rustyline = "15"
thiserror = "2"
